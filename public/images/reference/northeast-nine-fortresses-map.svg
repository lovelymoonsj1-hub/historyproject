<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">동북 9성의 대략적인 위치를 나타낸 학습용 지도</title>
  <desc id="desc">고려의 북동쪽 변경인 함흥평야에서 길주 일대에 동북 9성이 설치되었음을 보여 주는 지도</desc>
