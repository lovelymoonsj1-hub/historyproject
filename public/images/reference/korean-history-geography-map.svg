<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">한국사 주요 지리 개념과 주변 세력 학습 지도</title>
  <desc id="desc">한반도와 주변 지역에 위화도, 강화도, 삼별초, 한강 유역, 벽란도, 청해진, 동북 9성 및 주변 국가와 세력의 위치를 표시한 개략도</desc>
  <rect width="1100" height="680" fill="#e8f3f3"/>
  <path d="M80 115 C190 62 304 82 365 151 C421 215 435 276 486 334 C532 385 589 425 609 496 C622 545 591 594 540 624 L414 631 C356 590 311 542 265 488 C207 420 146 350 112 273 C89 222 74 164 80 115Z" fill="#fff4df" stroke="#6e9f98" stroke-width="5"/>
