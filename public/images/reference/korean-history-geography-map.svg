  <text x="858" y="78" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9b6341">중국 대륙</text>
  <text x="844" y="111" font-family="Arial, sans-serif" font-size="18" fill="#6a716f">한 · 진 · 당 · 송 · 원 · 명 · 청</text>
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#397e79">한국사 지리 탐험 지도</text>
  <text x="70" y="650" font-family="Arial, sans-serif" font-size="17" fill="#5e716f">※ 위치는 초등 학습을 위한 개략도이며, 시대별 국경과 성의 정확한 위치에는 학설 차이가 있습니다.</text>
